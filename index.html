<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>AI 真人换装搭配工具 - OUTFIT PREVIEW</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo-icon">👗</span>
      <div class="header-titles">
        <h1>OUTFIT PREVIEW</h1>
        <p>AI 真人换装搭配工具</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="personPhotoBtn" class="btn btn-secondary">📷 真人照片</button>
      <button id="importBtn" class="btn btn-secondary">📂 导入备份</button>
      <button id="exportBtn" class="btn btn-secondary">📤 导出备份</button>
      <button id="addClothingBtn" class="btn btn-primary">+ 添加衣服</button>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main-layout">
    <!-- 单品库区 -->
    <aside class="library-panel">
      <div class="panel-header">
        <div class="panel-tabs">
          <button class="tab-btn active" data-tab="wardrobe">衣橱</button>
          <button class="tab-btn" data-tab="sets">套装</button>
        </div>
        <span class="item-count" id="itemCount">0件单品</span>
      </div>
      <div class="library-controls" id="libraryControls">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索名称、颜色、备注...">
        <div class="category-filters" id="categoryFilters"></div>
        <div class="dropdown-filters">
          <select id="seasonFilter" class="filter-select">
            <option value="">季节：全部</option>
            <option value="春天">春天</option>
            <option value="夏天">夏天</option>
            <option value="秋天">秋天</option>
            <option value="冬天">冬天</option>
            <option value="四季">四季</option>
          </select>
          <select id="occasionFilter" class="filter-select">
            <option value="">场合：全部</option>
            <option value="通勤">通勤</option>
            <option value="休闲">休闲</option>
            <option value="约会">约会</option>
            <option value="运动">运动</option>
            <option value="宴会">宴会</option>
          </select>
        </div>
      </div>
      <div class="item-grid" id="itemGrid"></div>
      <div class="saved-sets" id="savedSets" style="display:none;"></div>
    </aside>

    <!-- 拖拽搭配区 -->
    <section class="styling-panel">
      <div class="panel-header">
        <h2>搭配区</h2>
        <div class="panel-actions">
          <span class="item-count" id="selectedCount">0件</span>
          <button id="randomBtn" class="btn btn-ghost btn-sm">🎲 随机</button>
          <button id="clearBtn" class="btn btn-ghost btn-sm">清空</button>
          <button id="saveOutfitBtn" class="btn btn-primary btn-sm">保存套装</button>
        </div>
      </div>
      <div class="drop-zones-grid" id="dropZonesGrid"></div>
      <div class="styling-footer">
        <div class="style-section">
          <span class="style-label">风格：</span>
          <div class="style-presets" id="stylePresets"></div>
        </div>
        <button id="generateBtn" class="btn btn-primary btn-lg" disabled>✨ AI 真人换装</button>
        <p class="generate-note">AI 只负责把衣服贴合到真人照片上，不生成虚拟人物</p>
      </div>
    </section>

    <!-- 穿搭成果展示区 -->
    <aside class="result-panel">
      <div class="panel-header">
        <h2>成果展示区</h2>
        <div style="display:flex;gap:6px;align-items:center;">
          <span class="model-badge">📷 真人照片</span>
          <button id="personPhotoBtn2" class="btn btn-ghost btn-sm">更换照片</button>
        </div>
      </div>
      <div class="result-display" id="resultDisplay">
        <div class="result-empty">
          <div class="model-ref-wrap">
            <img src="images/model_real_00034.jpg" alt="真人照片" class="model-ref-img" id="personPhotoPreview" onerror="this.style.display='none'">
            <div class="model-ref-label">真人照片</div>
          </div>
          <p class="empty-title">等待换装</p>
          <p class="empty-hint">选择单品并点击"AI 真人换装"</p>
          <p class="empty-sub">AI 将衣服贴合到真人照片，保留真人长相与身材</p>
        </div>
      </div>
      <div class="result-summary" id="resultSummary"></div>
      <div class="result-actions" id="resultActions" style="display: none;">
        <button id="downloadBtn" class="btn btn-secondary btn-sm">⬇ 下载</button>
        <button id="regenerateBtn" class="btn btn-secondary btn-sm">🔄 重新生成</button>
      </div>
    </aside>
  </main>

  <!-- Add Clothing Modal -->
  <div class="modal-overlay" id="addClothingModal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="addModalTitle">添加衣服</h3>
        <button class="modal-close" id="modalCloseBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>图片预览</label>
          <div class="image-upload" id="imageUpload">
            <div class="upload-placeholder" id="uploadPlaceholder">
              <span class="upload-icon">📷</span>
              <p>点击上传图片</p>
            </div>
            <img id="uploadedImagePreview" style="display:none;" alt="预览">
            <input type="file" id="imageInput" accept="image/*" style="display:none;">
          </div>
        </div>
        <div class="form-group">
          <label>名称 <span class="required">*</span></label>
          <input type="text" id="itemName" placeholder="如：白色纯棉T恤" class="form-input">
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" id="itemNote" placeholder="如：百搭基础款、适合通勤" class="form-input">
        </div>
        <div class="form-group">
          <label>类别</label>
          <select id="itemCategory" class="form-input">
            <option value="top">上衣</option>
            <option value="bottom">下装</option>
            <option value="outerwear">外套</option>
            <option value="dress">连衣裙</option>
            <option value="shoes">鞋</option>
            <option value="accessory">配饰</option>
            <option value="bag">包</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>颜色</label>
            <input type="text" id="itemColor" placeholder="如：白色" class="form-input">
          </div>
          <div class="form-group">
            <label>季节</label>
            <select id="itemSeason" class="form-input">
              <option value="四季">四季</option>
              <option value="春天">春天</option>
              <option value="夏天">夏天</option>
              <option value="秋天">秋天</option>
              <option value="冬天">冬天</option>
            </select>
          </div>
          <div class="form-group">
            <label>场合</label>
            <select id="itemOccasion" class="form-input">
              <option value="休闲">休闲</option>
              <option value="通勤">通勤</option>
              <option value="约会">约会</option>
              <option value="运动">运动</option>
              <option value="宴会">宴会</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>AI 描述（用于辅助换装）</label>
          <input type="text" id="itemDesc" placeholder="如：a white cotton t-shirt" class="form-input">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancelAddBtn">取消</button>
        <button class="btn btn-primary" id="confirmAddBtn">确认添加</button>
      </div>
    </div>
  </div>

  <!-- Person Photo Modal -->
  <div class="modal-overlay" id="personPhotoModal" style="display: none;">
    <div class="modal" style="max-width: 460px;">
      <div class="modal-header">
        <h3>真人照片设置</h3>
        <button class="modal-close" id="personPhotoCloseBtn">×</button>
      </div>
      <div class="modal-body">
        <div style="background:#f0fdfa;border-radius:8px;padding:12px;margin-bottom:16px;">
          <p style="font-size:12px;color:#0d9488;line-height:1.6;margin-bottom:8px;">
            上传你自己的真实照片（建议全身或半身、光线充足、正面站立），AI 会只替换衣服：
          </p>
          <ul style="font-size:11px;color:#64748b;line-height:1.7;margin-left:16px;">
            <li>不会生成虚拟人物，真人长相与身材保持不变</li>
            <li>照片仅保存在本地浏览器，不会上传到服务器</li>
          </ul>
        </div>
        <div class="person-photo-preview-wrap">
          <img id="personPhotoModalPreview" src="images/model_real_00034.jpg" alt="真人照片预览">
        </div>
        <div class="form-group" style="margin-top:14px;">
          <input type="file" id="personPhotoInput" accept="image/*" style="display:none;">
          <button class="btn btn-primary" style="width:100%;" id="personPhotoUploadBtn">📷 上传/更换真人照片</button>
        </div>
        <div class="form-group">
          <button class="btn btn-ghost" style="width:100%;" id="personPhotoResetBtn">使用内置真人示例照</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="personPhotoCancelBtn">取消</button>
        <button class="btn btn-primary" id="personPhotoSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Hidden file input for import -->
  <input type="file" id="importInput" accept=".json" style="display:none;">

  <script src="app.js?v=11"></script>
</body>
</html>
